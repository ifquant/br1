<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Scene Concepts</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #222; }
    body { margin: 0; padding: 16px; }
    main { max-width: 800px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 1.25rem; line-height: 26px; }
    p { margin: 0 0 12px; line-height: 22px; }
    canvas { display: block; width: 100%; height: auto; background: #fff; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button, select { min-height: 44px; font: inherit; }
    #concept-caption { min-height: 4.2em; }
    #load-error { color: #a00; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Reading Scene Concepts</h1>
    <p>Authored animations of future reading companions, not current br1 features.</p>
    <canvas id="concept" width="480" height="270" aria-label="Animated reading scene" aria-describedby="concept-caption"></canvas>
    <div class="controls" aria-label="Playback controls">
      <select id="story-selector" aria-label="Story">
        <option value="war">Cannae: double envelopment</option>
        <option value="grimm">The Frog Prince: a promise</option>
      </select>
      <button id="play" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
    </div>
    <p id="concept-caption" aria-live="polite"></p>
    <p id="load-error" role="alert" hidden></p>
  </main>
  <script src="cannae-scene.js"></script>
  <script>
    (() => {
      const canvas = document.querySelector('#concept');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height, seconds = 12, fps = 10;
      const selector = document.querySelector('#story-selector');
      const playButton = document.querySelector('#play');
      const caption = document.querySelector('#concept-caption');
      const courtyard = new Image();
      let story = new URLSearchParams(location.search).get('story') === 'grimm' ? 'grimm' : 'war';
      let elapsedMs = 0, startedAt = performance.now();
      let running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      let captionKey = '';
      const clamp = (n) => Math.max(0, Math.min(1, n));
      const ease = (n) => { n = clamp(n); return n * n * (3 - 2 * n); };
      const mix = (a, b, n) => a + (b - a) * ease(n);
      const fairyPhases = [
        { heading: 'A knock at the door', copy: 'The frog comes to the castle, asking the princess to honor the promise she made by the spring.' },
        { heading: 'A promise remembered', copy: 'She hesitates. In the source story, her father reminds her to keep her word.' },
        { heading: 'The door opens', copy: 'The princess opens the door and reaches out to welcome the frog.' },
        { heading: 'A promise kept', copy: 'The frog enters. This adapted scene focuses on acting on a promise, not just making one.' }
      ];

      function ellipse(x, y, rx, ry, color) {
        ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      }
      function path(points, color, stroke, width = 1) {
        ctx.beginPath(); points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        if (color) { ctx.closePath(); ctx.fillStyle = color; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
      }

      // Poses and foot placement are animated independently of the fixed painted background.
      function princess(x, y, welcome, walk) {
        ctx.save(); ctx.translate(x, y + Math.sin(walk * Math.PI * 2) * 1.1);
        ellipse(0, -2, 23, 3, '#00000020');
        ctx.fillStyle = '#754631'; ctx.beginPath(); ctx.moveTo(2, -97); ctx.bezierCurveTo(25, -98, 25, -59, 13, -51); ctx.lineTo(-10, -60); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c96d8e'; ctx.beginPath(); ctx.moveTo(-8, -69); ctx.quadraticCurveTo(-13, -37, -25, -5); ctx.quadraticCurveTo(0, 3, 25, -5); ctx.quadraticCurveTo(12, -40, 8, -69); ctx.closePath(); ctx.fill();
        path([[-5, -55], [-13, -7], [-3, -5], [3, -55]], '#e7a2b8');
        path([[8, -50], [16, -7]], null, '#a65173', 2);
        path([[-8, -62], [8, -62]], null, '#f4d572', 3);
        ellipse(-3, -84, 10, 12, '#f3c5a6');
        ctx.fillStyle = '#794932'; ctx.beginPath(); ctx.arc(-1, -87, 12, Math.PI, Math.PI * 2); ctx.lineTo(11, -71); ctx.quadraticCurveTo(3, -79, 2, -92); ctx.closePath(); ctx.fill();
        path([[-11, -98], [-13, -107], [-5, -102], [1, -109], [6, -102], [12, -107], [10, -98]], '#ebbd4b', '#a17521');
        ellipse(-8, -85, 1.2, 1.6, '#47322d');
        path([[-12, -78], [-7, welcome ? -76 : -78]], null, '#a15a50');
        if (welcome) {
          path([[-8, -64], [-25, -48], [-38, -44]], null, '#dc91ab', 8);
          path([[-38, -44], [-46, -43]], null, '#f3c5a6', 5);
          path([[8, -64], [15, -47]], null, '#dc91ab', 7);
        } else {
          path([[-8, -64], [-13, -53], [-2, -50]], null, '#dc91ab', 7);
          path([[8, -64], [10, -53], [-2, -50]], null, '#dc91ab', 7);
          ellipse(-2, -50, 4, 3, '#f3c5a6');
        }
        ctx.restore();
      }

      function frog(x, y, hop) {
        ellipse(x, y + 2, 11, 2.5, '#00000025');
        ctx.save(); ctx.translate(x, y - hop);
        path([[-6, -4], [-13, hop > 2 ? 1 : -1], [-17, 1]], null, '#426e31', 4);
        ellipse(0, -7, 10, 7, '#609446'); ellipse(5, -9, 7, 6, '#7bb654');
        ellipse(6, -14, 3.5, 4, '#8bc766'); ellipse(7, -14, 1.7, 2.4, '#e6edbb'); ellipse(8, -14, .9, 1.8, '#223b27');
        path([[5, -6], [13, -7]], null, '#385b31'); path([[3, -3], [9, 1], [14, 1]], null, '#426e31', 3);
        ctx.restore();
      }

      function door(open) {
        // Hold the right hinge fixed; narrowing the panel exposes the painted doorway.
        ctx.save(); ctx.translate(390, 0); ctx.scale(1 - open * .98, 1); ctx.translate(-390, 0);
        ctx.beginPath(); ctx.moveTo(301, 222); ctx.lineTo(301, 102); ctx.bezierCurveTo(301, 67, 329, 45, 346, 45); ctx.bezierCurveTo(368, 45, 390, 68, 390, 102); ctx.lineTo(390, 222); ctx.closePath();
        ctx.fillStyle = '#946342'; ctx.fill(); ctx.save(); ctx.clip();
        for (let x = 309; x < 391; x += 12) path([[x, 49], [x, 224]], null, '#72492e', 2);
        for (const y of [125, 195]) { ctx.fillStyle = '#514733'; ctx.fillRect(302, y, 88, 5); }
        ctx.restore(); ctx.strokeStyle = '#60412d'; ctx.lineWidth = 3; ctx.stroke();
        ellipse(314, 158, 3, 4, '#e6bd59'); ctx.restore();
      }

      function drawFairy(time) {
        ctx.drawImage(courtyard, 0, 0, W, H);
        const open = ease((time - 4.8) / 2.1);
        const princessX = mix(361, 331, (time - 5.5) / 2.5);
        if (time >= 4.8 && time < 6.5) princess(princessX, 222, false, time * 2);
        door(open);
        // After stepping out she is in front of the open panel, not behind the wall.
        if (time >= 6.5) princess(princessX, 222, time >= 7.7, time < 8 ? time * 2 : 0);
        const moving = time < 2.8 || (time >= 8.5 && time < 11);
        const x = time < 2.8 ? mix(70, 281, time / 2.8) : mix(281, 365, (time - 8.5) / 2.5);
        const y = mix(239, 222, (time - 8.5) / 2.5);
        frog(x, y, moving ? Math.abs(Math.sin(time * Math.PI * 2.5)) * 9 : 0);
        if (time >= 2.8 && time < 4.8) {
          const pulse = (time * 3) % 1;
          ctx.strokeStyle = '#f5cf65'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(300, 213, 4 + pulse * 9, -1.9, -.6); ctx.stroke();
        }
        ctx.fillStyle = '#ffffffee'; ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = '#373130'; ctx.font = '700 16px Arial'; ctx.fillText('THE FROG PRINCE', 12, 21);
        ctx.font = '10px Arial'; ctx.textAlign = 'right'; ctx.fillText('ADAPTED SCENE / CONCEPT', W - 10, 20); ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffffee'; ctx.fillRect(0, 247, W, 23);
        ctx.fillStyle = '#373130'; ctx.font = '700 13px Arial'; ctx.fillText(fairyPhases[Math.min(3, Math.floor(time / 3))].heading, 12, 263);
      }

      function currentTime(now = performance.now()) {
        // A queued animation frame can carry a timestamp from just before a restart.
        return ((elapsedMs + (running ? Math.max(0, now - startedAt) : 0)) / 1000) % seconds;
      }
      function setPlayback(value) {
        const next = Boolean(value); if (next === running) return;
        if (next) startedAt = performance.now(); else elapsedMs += performance.now() - startedAt;
        running = next; playButton.textContent = running ? 'Pause' : 'Play';
      }
      function draw(time) {
        if (story === 'war') window.drawCannaeScene(ctx, time, W, H);
        else if (courtyard.complete && courtyard.naturalWidth) drawFairy(time);
        const phase = Math.min(3, Math.floor(time / 3));
        const key = `${story}:${phase}`;
        if (key !== captionKey) {
          captionKey = key;
          const content = story === 'war' ? window.cannaePhase(time) : fairyPhases[phase];
          caption.textContent = `${content.heading}. ${content.copy} Authored concept, not a current br1 feature.`;
        }
      }
      window.readingConceptAssetsReady = new Promise((resolve, reject) => {
        courtyard.onload = () => { draw(currentTime()); resolve(); };
        courtyard.onerror = () => {
          const error = document.querySelector('#load-error'); error.hidden = false;
          error.textContent = 'The story background could not be loaded.'; reject(new Error(error.textContent));
        };
        courtyard.src = new URL('../images/grimm-courtyard.png', location.href).href;
      });
      window.renderReadingConcept = (requestedStory, time) => {
        story = requestedStory === 'grimm' ? 'grimm' : 'war'; selector.value = story;
        const safeTime = ((Number(time) % seconds) + seconds) % seconds;
        elapsedMs = safeTime * 1000; startedAt = performance.now(); draw(safeTime);
        return Math.min(3, Math.floor(safeTime / 3));
      };
      window.setReadingConceptPlayback = setPlayback;
      window.getReadingConceptTime = currentTime;
      window.getReadingConceptSize = () => ({ width: W, height: H, seconds, fps });
      selector.value = story; playButton.textContent = running ? 'Pause' : 'Play';
      playButton.onclick = () => setPlayback(!running);
      document.querySelector('#restart').onclick = () => { elapsedMs = 0; startedAt = performance.now(); setPlayback(true); draw(0); };
      selector.onchange = () => window.renderReadingConcept(selector.value, 0);
      function live(now) { if (running) draw(currentTime(now)); requestAnimationFrame(live); }
      requestAnimationFrame(live);
    })();
  </script>
</body>
</html>
